<div class="modal-overlay" id="authModalOverlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
        <button type="button" class="modal-close" id="authModalClose" aria-label="Close">&times;</button>

        <div class="modal-tabs">
            <button type="button" class="modal-tab is-active" data-tab="login" id="tabLogin">Log In</button>
            <button type="button" class="modal-tab" data-tab="signup" id="tabSignup">Sign Up</button>
        </div>

        <div class="modal-body">
            <form id="loginForm" class="modal-form" novalidate>
                {% csrf_token %}
                <h2 id="authModalTitle">Welcome back</h2>
                <div class="form-group">
                    <label for="loginEmail">Email address</label>
                    <input type="email" id="loginEmail" name="email" class="form-input" required>
                    <span class="field-error" data-error-for="email"></span>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" class="form-input" required>
                    <span class="field-error" data-error-for="password"></span>
                </div>
                <p class="modal-error" data-error-for="__all__"></p>
                <button type="submit" class="btn btn-primary auth-submit" id="loginSubmitBtn">Log in</button>
            </form>

            <form id="signupForm" class="modal-form" novalidate hidden>
                {% csrf_token %}
                <h2>Create your account</h2>
                <fieldset class="form-group account-type-options">
                    <legend>Account type</legend>
                    <label class="account-type-option">
                        <input type="radio" name="account_type" value="customer" checked>
                        <span><strong>Regular Customer</strong><small>Shop and check out straight away.</small></span>
                    </label>
                    <label class="account-type-option">
                        <input type="radio" name="account_type" value="dealer">
                        <span><strong>Dealer / B2B Partner</strong><small>Submit business details for admin approval.</small></span>
                    </label>
                    <span class="field-error" data-error-for="account_type"></span>
                </fieldset>
                <div class="form-row">
                    <div class="form-group">
                        <label for="signupFirstName">First name</label>
                        <input type="text" id="signupFirstName" name="first_name" class="form-input" required>
                        <span class="field-error" data-error-for="first_name"></span>
                    </div>
                    <div class="form-group">
                        <label for="signupLastName">Last name</label>
                        <input type="text" id="signupLastName" name="last_name" class="form-input">
                        <span class="field-error" data-error-for="last_name"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email address</label>
                    <input type="email" id="signupEmail" name="email" class="form-input" required>
                    <span class="field-error" data-error-for="email"></span>
                </div>
                <div class="form-group">
                    <label for="signupPhone">Phone number</label>
                    <input type="tel" id="signupPhone" name="phone_number" class="form-input" required>
                    <span class="field-error" data-error-for="phone_number"></span>
                </div>

                <div class="dealer-fields" id="dealerFields" hidden>
                    <p class="dealer-fields-note">Dealer accounts are activated after the Hi-Tech team verifies the details below.</p>
                    <div class="form-group">
                        <label for="companyName">Company name</label>
                        <input type="text" id="companyName" name="company_name" class="form-input" data-dealer-required>
                        <span class="field-error" data-error-for="company_name"></span>
                    </div>
                    <div class="form-group">
                        <label for="gstinOrTaxId">GSTIN / Tax ID</label>
                        <input type="text" id="gstinOrTaxId" name="gstin_or_tax_id" class="form-input" data-dealer-required>
                        <span class="field-error" data-error-for="gstin_or_tax_id"></span>
                    </div>
                    <div class="form-group">
                        <label for="businessAddress">Business address</label>
                        <textarea id="businessAddress" name="business_address" class="form-input" rows="2" data-dealer-required></textarea>
                        <span class="field-error" data-error-for="business_address"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupPassword1">Password</label>
                    <input type="password" id="signupPassword1" name="password1" class="form-input" required minlength="8">
                    <span class="field-error" data-error-for="password1"></span>
                </div>
                <div class="form-group">
                    <label for="signupPassword2">Confirm password</label>
                    <input type="password" id="signupPassword2" name="password2" class="form-input" required>
                    <span class="field-error" data-error-for="password2"></span>
                </div>
                <p class="modal-error" data-error-for="__all__"></p>
                <button type="submit" class="btn btn-primary auth-submit" id="signupSubmitBtn">Create account</button>
            </form>
        </div>
    </div>
</div>
